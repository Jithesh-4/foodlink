<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodLink – Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{--gold:#D4A017;--deep:#1A140A;--muted:#8B7355;}
  body{font-family:'DM Sans',sans-serif;background:var(--deep);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;}
  body::before{content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse at 50% 30%,rgba(212,160,23,0.12) 0%,transparent 65%);pointer-events:none;}
  .box{background:rgba(255,255,255,0.04);border:1px solid rgba(212,160,23,0.2);
    border-radius:28px;padding:56px 48px;width:100%;max-width:420px;
    backdrop-filter:blur(20px);animation:fadeUp 0.5s ease;}
  .back{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,0.35);
    font-size:0.82rem;text-decoration:none;margin-bottom:32px;transition:color 0.2s;}
  .back:hover{color:var(--gold);}
  .icon-wrap{width:60px;height:60px;border-radius:18px;background:rgba(212,160,23,0.12);
    border:1px solid rgba(212,160,23,0.25);display:flex;align-items:center;
    justify-content:center;font-size:1.8rem;margin-bottom:20px;}
  h1{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:900;color:white;margin-bottom:6px;}
  p.sub{color:rgba(255,255,255,0.4);font-size:0.88rem;line-height:1.6;margin-bottom:32px;}
  .field{margin-bottom:14px;}
  label{display:block;font-size:0.75rem;color:rgba(255,255,255,0.4);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:7px;}
  input{width:100%;padding:13px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
    border-radius:11px;color:white;font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s;}
  input:focus{border-color:var(--gold);background:rgba(212,160,23,0.07);}
  .btn{width:100%;padding:14px;background:var(--gold);color:var(--deep);border:none;border-radius:11px;
    font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity 0.2s;}
  .btn:hover{opacity:0.88;}
  .flash{background:rgba(220,38,38,0.12);border:1px solid rgba(220,38,38,0.25);border-radius:10px;
    padding:12px 16px;color:#fca5a5;font-size:0.85rem;margin-bottom:16px;}
  .warning{margin-top:20px;padding:12px 16px;background:rgba(212,160,23,0.08);
    border:1px solid rgba(212,160,23,0.2);border-radius:10px;color:rgba(212,160,23,0.7);
    font-size:0.78rem;text-align:center;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="box">
  <a href="/" class="back">← Back to Home</a>
  <div class="icon-wrap">⚙️</div>
  <h1>Admin Panel</h1>
  <p class="sub">Restricted access. Verify NGO registrations, manage listings, and oversee platform operations.</p>
  {% if error %}<div class="flash">{{ error }}</div>{% endif %}
  <form method="POST" action="/admin/login">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="admin" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Access Admin Panel →</button>
  </form>
  <div class="warning">🔒 This page is for platform administrators only</div>
</div>
</body>
</html>
